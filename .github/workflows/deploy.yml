name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per ref: a single constant group would let a pull-request run cancel an in-flight deploy of
# main. Superseded PR runs are still cancelled; a main run is allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # check:api reads the loader sources to index the API it verifies references against
      - uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoader
          ref: main
          path: OhMyLoader
      # Bun runs the check scripts and vitepress directly; no separate Node setup needed
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # en/zh pages must stay one-to-one; fail the build before the docs compile
      - run: bun run check:sync
      # documented API references must resolve against the loader source (AC-8)
      - run: bun run check:api
      # vitepress build fails on dead links, so this doubles as a docs-link check
      - run: bun run build
      # the artifact is only consumed by deploy on main; on PRs it is just a build check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # verify the en/zh pairing once more against what is actually being deployed
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:sync
      - id: deployment
        uses: actions/deploy-pages@v5
