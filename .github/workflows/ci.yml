# The PR gate stub: machinery lives in the Foundation reusable workflow, pinned to @v1.
# The composed scripts run every gate: the site's en/zh pairing, the editor's typecheck and
# tests, and the one build that ships both the site and the editor page.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    uses: OhMyLoader/Foundation/.github/workflows/web-ci.yml@v1
    with:
      bun-version: 1.4.4
      typecheck-command: "bun run typecheck"
      test-command: "bun run check:sync && bun run test"
      build-command: "bun run build"
